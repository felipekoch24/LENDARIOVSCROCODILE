<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Lendário vs Crocodilos</title>

    <!-- Configurações para iPhone / Safari -->
    <link rel="apple-touch-icon" href="icone_jogo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lendário vs Croc">

    <!-- Chamada do arquivo de estilo separado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Tela Inicial -->
        <div id="tela-inicio" ontouchstart="iniciarJogo()" onclick="iniciarJogo()"></div>

        <div id="ui">
            Pontos: <span id="pontos">0</span><br>
            Fase: <span id="fase">1</span>
        </div>

        <div id="boss-ui">
            <span>CROC VIDA</span>
            <div id="barra-vida-container">
                <div id="barra-vida-atual"></div>
            </div>
        </div>

        <!-- Crocodilo -->
        <div id="crocodilo-container" style="top: 20px;">
            <img id="crocodilo" src="crocodilo_recortado.png" alt="Crocodilo">
        </div>

        <!-- O Lendário -->
        <img id="lendario" src="lendario_recortado.png" alt="O Lendário" style="left: 50%;">

        <!-- Botões -->
        <div id="controles">
            <button class="btn-acao" ontouchstart="moverEsquerda()" onclick="moverEsquerda()">◀ ESQ</button>
            <button class="btn-acao" id="btn-jogar" ontouchstart="lancarBomba()" onclick="lancarBomba()">💣 JOGAR</button>
            <button class="btn-acao" ontouchstart="moverDireita()" onclick="moverDireita()">DIR ▶</button>
        </div>

        <!-- Tela de Derrota -->
        <div id="tela-gameover" class="tela-overlay">
            <h1 style="color: #ff3333;">FIM DE JOGO</h1>
            <p>O crocodilo te pegou! Tente novamente e mostre sua força.</p>
            <button class="btn-menu" ontouchstart="reiniciarJogo()" onclick="reiniciarJogo()">TENTAR NOVAMENTE</button>
        </div>

        <!-- Tela de Vitória da Fase -->
        <div id="tela-vitoria" class="tela-overlay">
            <h1 style="color: #00ffcc;">VITÓRIA! 🏆</h1>
            <p id="texto-vitoria">Você explodiu o crocodilo!</p>
            <button class="btn-menu" style="background-color: #ffcc00;" ontouchstart="proximaFase()" onclick="proximaFase()">PRÓXIMA FASE</button>
        </div>
    </div>

    <!-- Chamada do arquivo de lógica separado -->
    <script src="jogo.js"></script>
</body>
</html>
